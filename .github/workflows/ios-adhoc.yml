name: ios-adhoc

# Archive iOS signée ad-hoc + IPA en artefact, sans Mac local.
#
# Pourquoi ce workflow existe : la version Swift ne peut être compilée que par
# Xcode (SwiftUI, Charts, PDFKit…). Le workflow `testflight.yml` produit déjà un
# IPA signé, mais avec la méthode `app-store` — inutilisable pour une
# installation directe. Ici on exporte en `ad-hoc`, ce qui donne un IPA
# installable par USB (`ideviceinstaller`) ou OTA sur les appareils dont l'UDID
# figure dans le profil de provisionnement `duello-swift-adhoc`.
#
# Signature MANUELLE (même schéma que testflight.yml) : la config Release de la
# cible app porte CODE_SIGN_STYLE=Manual + PROVISIONING_PROFILE_SPECIFIER. On
# importe le certificat « Apple Distribution » (.p12) et les DEUX profils
# (app-store pour l'archive, ad-hoc pour l'export).
#
# Secrets requis :
#   BUILD_CERTIFICATE_BASE64          .p12 distribution (base64)
#   P12_PASSWORD                      mot de passe du .p12
#   KEYCHAIN_PASSWORD                 mot de passe jetable du keychain
#   PROVISIONING_PROFILE_BASE64       duello-swift-appstore.mobileprovision (base64)
#   PROVISIONING_PROFILE_ADHOC_BASE64 duello-swift-adhoc.mobileprovision (base64)
#
# Déclenchement : workflow_dispatch, ou push sur la branche ci-dessous.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Numéro de build (CFBundleVersion). Vide = horodatage."
        required: false
        default: ""
  push:
    branches: [agent/ios-adhoc]

permissions:
  contents: read

concurrency:
  group: ios-adhoc-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-adhoc:
    name: Archive + export ad-hoc
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode le plus récent du runner
        run: |
          set -euo pipefail
          LATEST="$(ls /Applications | grep -oE 'Xcode_[0-9]+(\.[0-9]+)*' | sort -V | tail -1)"
          echo "Xcode retenu : $LATEST"
          sudo xcode-select -s "/Applications/${LATEST}.app/Contents/Developer"
          xcodebuild -version

      - name: Import du certificat de distribution
        env:
          CERT_P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Installation des profils (app-store pour l'archive, ad-hoc pour l'export)
        env:
          PROFILE_STORE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROFILE_ADHOC_B64: ${{ secrets.PROVISIONING_PROFILE_ADHOC_BASE64 }}
        run: |
          set -euo pipefail
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"
          echo -n "$PROFILE_STORE_B64"  | base64 --decode > "$DEST/duello-swift-appstore.mobileprovision"
          echo -n "$PROFILE_ADHOC_B64"  | base64 --decode > "$DEST/duello-swift-adhoc.mobileprovision"

      - name: Dépendances SwiftPM (GoogleSignIn-iOS)
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project Duello.xcodeproj -scheme Duello

      - name: Archive (Release, signature manuelle via le projet)
        run: |
          set -euo pipefail
          BN="${{ github.event.inputs.build_number }}"
          [ -z "$BN" ] && BN="$(date -u +%Y%m%d%H%M)"
          echo "CFBundleVersion = $BN"
          xcodebuild archive \
            -project Duello.xcodeproj \
            -scheme Duello \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Duello.xcarchive" \
            CURRENT_PROJECT_VERSION="$BN"

      - name: ExportOptions.plist (ad-hoc)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>9L7AY22737</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.prepapp.mobile.swift</key>
              <string>duello-swift-adhoc</string>
            </dict>
            <key>uploadSymbols</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Export de l'IPA (ad-hoc)
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Duello.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Renommage + empreinte de l'IPA
        run: |
          set -euo pipefail
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          cp "$IPA" "$RUNNER_TEMP/Duello-swift-adhoc.ipa"
          shasum -a 256 "$RUNNER_TEMP/Duello-swift-adhoc.ipa"

      - name: Upload de l'artefact IPA
        uses: actions/upload-artifact@v4
        with:
          name: duello-swift-adhoc-ipa
          path: ${{ runner.temp }}/Duello-swift-adhoc.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Nettoyage du keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
