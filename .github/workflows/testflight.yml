name: testflight

# Build iOS RÉEL signé + upload TestFlight, sans Mac local.
# Runner macOS hébergé par GitHub (gratuit : le dépôt est public).
#
# Signature MANUELLE : on n'utilise pas la signature automatique (pas de compte
# Apple connecté sur le runner). On importe le certificat « Apple Distribution »
# (.p12) dans un keychain temporaire, on installe le profil de provisionnement
# IOS_APP_STORE « duello-swift-appstore », puis on archive/exporte/upload.
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   BUILD_CERTIFICATE_BASE64   .p12 distribution (base64)
#   P12_PASSWORD               mot de passe du .p12
#   KEYCHAIN_PASSWORD          mot de passe jetable du keychain temporaire
#   PROVISIONING_PROFILE_BASE64  duello-swift-appstore.mobileprovision (base64)
#   APPSTORE_API_KEY_ID        ex. J4PAPR5539
#   APPSTORE_API_ISSUER        issuer id Apple
#   APPSTORE_API_KEY_BASE64    AuthKey_<id>.p8 (base64)
#
# Déclenchement : workflow_dispatch (une fois le fichier sur la branche par
# défaut) ou push sur la branche ci-dessous.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Numéro de build (CFBundleVersion). Vide = horodatage."
        required: false
        default: ""
  push:
    branches: [agent/testflight-ci]

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-upload:
    name: Archive + upload TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode le plus récent du runner
        run: |
          set -euo pipefail
          LATEST="$(ls /Applications | grep -oE 'Xcode_[0-9]+(\.[0-9]+)*' | sort -V | tail -1)"
          echo "Xcode retenu : $LATEST"
          sudo xcode-select -s "/Applications/${LATEST}.app/Contents/Developer"
          xcodebuild -version

      - name: Import du certificat de distribution
        env:
          CERT_P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Installation du profil de provisionnement
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Clé API App Store Connect
        env:
          ASC_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$ASC_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Dépendances SwiftPM (GoogleSignIn-iOS)
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project Duello.xcodeproj -scheme Duello

      - name: Archive (Release, signature automatique via clé API)
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APPSTORE_API_ISSUER }}
        run: |
          set -euo pipefail
          BN="${{ github.event.inputs.build_number }}"
          [ -z "$BN" ] && BN="$(date -u +%Y%m%d%H%M)"
          echo "CFBundleVersion = $BN"
          # Signature automatique : Xcode choisit/crée le profil via la clé API.
          # On ne fixe PAS PROVISIONING_PROFILE_SPECIFIER en ligne de commande :
          # cela s'appliquerait aussi aux cibles des paquets SwiftPM (GoogleSignIn,
          # GTMAppAuth, AppAuth, GTMSessionFetcher) qui n'ont pas de profil et
          # feraient échouer l'archive (exit 65).
          xcodebuild archive \
            -project Duello.xcodeproj \
            -scheme Duello \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Duello.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER" \
            DEVELOPMENT_TEAM=9L7AY22737 \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BN"

      - name: ExportOptions.plist
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>9L7AY22737</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Export de l'IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Duello.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload vers TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APPSTORE_API_ISSUER }}
        run: |
          set -euo pipefail
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          echo "Upload de $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER" --verbose

      - name: Nettoyage du keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
