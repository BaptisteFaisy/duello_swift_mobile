name: screenshots

# Captures d'écran du rendu SwiftUI réel, pour comparaison avec l'app
# React Native (source de vérité). Un runner macOS hébergé par GitHub boote un
# simulateur iPhone, installe l'app et photographie chaque écran listé, puis
# publie les PNG en artefact.
#
# Pourquoi ici et pas sur le poste : SwiftUI n'existe que dans le SDK d'Xcode.
# Le pré-contrôle Linux vérifie la syntaxe et les types, jamais le rendu.
#
# Le pilotage se fait par le mode `DUELLO_SHOT` (Duello/ScreenshotTour.swift) :
# variable d'environnement lue au lancement, qui sème une session factice et
# fige la racine sur l'écran demandé. Aucun tap n'est nécessaire.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Duello/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Écrans photographiés. Ajouter une valeur ici suffit : le mode capture la
  # reconnaît côté app (Duello/ScreenshotTour.swift).
  SHOT_SCREENS: welcome login register onboarding profile training challenges settings settings-personal settings-account settings-duello premium feedback privacy terms email password blocked notifications
  BUNDLE_ID: com.prepapp.mobile.swift
  # Nom de simulateur PRÉFÉRÉ. Le nom exact des appareils dépend de l'image du
  # runner et change dans le temps (iPhone 16 a disparu de `macos-15` en
  # septembre 2026 → « Unable to find a device matching … name:iPhone 16 »).
  # S'il n'existe pas, le premier iPhone disponible est retenu.
  DEVICE_PREF: iPhone 16

jobs:
  screenshots:
    name: Captures simulateur
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode + simulateur iPhone disponibles
        run: |
          set -euo pipefail
          # On ne prend pas « le Xcode le plus récent » à l'aveugle : un Xcode
          # tout neuf peut n'avoir AUCUN runtime iOS installé (et le nom exact
          # des simulateurs change avec l'image). On retient donc le Xcode le
          # plus récent qui expose au moins un iPhone simulable, et son UDID.
          pick_xcode=""
          pick_line=""
          XCS="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr || true)"
          [ -n "$XCS" ] || XCS="/Applications/Xcode.app"
          for XC in $XCS; do
            sudo xcode-select -s "$XC/Contents/Developer" 2>/dev/null || continue
            LINE="$(xcrun simctl list devices available -j 2>/dev/null | python3 -c '
          import json, os, sys
          try:
              devs = json.load(sys.stdin)["devices"]
          except Exception:
              sys.exit(0)
          iphones = [d for r in devs.values() for d in r if d["name"].startswith("iPhone")]
          if not iphones:
              sys.exit(0)
          pref = [d for d in iphones if d["name"] == os.environ.get("DEVICE_PREF", "")]
          pick = (pref or sorted(iphones, key=lambda d: d["name"]))[0]
          print(pick["udid"], pick["name"])
          ')"
            if [ -n "$LINE" ]; then
              pick_xcode="$XC"
              pick_line="$LINE"
              break
            fi
          done
          [ -n "$pick_xcode" ] || { echo "::error::aucun Xcode du runner n'expose de simulateur iPhone"; exit 1; }
          echo "Xcode retenu    : $pick_xcode"
          echo "Simulateur retenu : $(echo "$pick_line" | cut -d' ' -f2-)"
          echo "DEVICE_ID=$(echo "$pick_line" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Dépendances SwiftPM (GoogleSignIn-iOS)
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project Duello.xcodeproj -scheme Duello

      - name: Build simulateur (sans signature)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Duello.xcodeproj \
            -scheme Duello \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Boot du simulateur
        run: |
          set -euo pipefail
          # DEVICE_ID a été résolu par l'étape « Xcode + simulateur iPhone
          # disponibles » et exporté dans $GITHUB_ENV.
          echo "Simulateur : $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Installer l'app
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products -maxdepth 2 -name 'Duello.app' -type d | head -1)"
          echo "App : $APP"
          xcrun simctl install "$DEVICE_ID" "$APP"

      - name: Photographier chaque écran
        run: |
          set -euo pipefail
          mkdir -p shots
          for SCREEN in $SHOT_SCREENS; do
            echo "— écran : $SCREEN"
            xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            SIMCTL_CHILD_DUELLO_SHOT="$SCREEN" \
              xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID" >/dev/null
            # Laisse le premier rendu, les polices et un éventuel appel réseau
            # se poser : un écran capturé trop tôt est un écran vide.
            sleep 8
            xcrun simctl io "$DEVICE_ID" screenshot "shots/$SCREEN.png"
          done
          ls -la shots

      - name: Publier les captures
        uses: actions/upload-artifact@v4
        with:
          name: duello-swift-shots
          path: shots/*.png
          if-no-files-found: error
          retention-days: 30
